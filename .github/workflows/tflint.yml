name: tflint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tflint:
    name: ${{ matrix.root }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        root:
          - github/chikachow
          - github/cysp
          - cloudflare/chikachow/account
          - cloudflare/chikachow/zones/chikachow-org

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6

      - run: terraform -chdir="${{ matrix.root }}" init -backend=false -lockfile=readonly

      - run: terraform -chdir="${{ matrix.root }}" validate

      - run: tflint --chdir="${{ matrix.root }}" --format=compact

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive

  module-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - github-repository
          - github-repository-ruleset-required-status-checks
          - github-repository-ruleset-require-pull-request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
      - run: cp github/chikachow/.terraform.lock.hcl "modules/${{ matrix.module }}/.terraform.lock.hcl"
      - run: terraform -chdir="modules/${{ matrix.module }}" init -backend=false -lockfile=readonly
      - run: terraform -chdir="modules/${{ matrix.module }}" test

  required:
    name: tflint
    runs-on: ubuntu-latest
    needs: [tflint, format, module-tests]
    if: ${{ always() }}

    steps:
      - run: |
          if [ "${{ needs.tflint.result }}" != "success" ] ||
             [ "${{ needs.format.result }}" != "success" ] ||
             [ "${{ needs.module-tests.result }}" != "success" ]; then
            exit 1
          fi
